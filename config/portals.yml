  - name: Google
    careers_url: https://www.google.com/about/careers/applications/
    enabled: true
  - name: Meta
    careers_url: https://www.metacareers.com/jobs
    enabled: true
  - name: Amazon
    careers_url: https://www.amazon.jobs
    provider: amazon
    enabled: true
  - name: Microsoft
    careers_url: https://careers.microsoft.com
    enabled: true
  - name: Apple
    careers_url: https://jobs.apple.com
    enabled: true
  - name: Netflix
    careers_url: https://jobs.netflix.com
    enabled: true
  - name: Palantir
    careers_url: https://www.palantir.com/careers/
