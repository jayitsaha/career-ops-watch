    enabled: true
  - name: DRW
    careers_url: https://drw.com/careers
    enabled: true
  - name: Hudson River Trading
    careers_url: https://www.hudsonrivertrading.com/careers/
    enabled: true
  - name: Optiver
    careers_url: https://optiver.com/working-at-optiver/career-opportunities/
