# -- Search queries --
# Broad discovery fallback for postings outside tracked_companies. Multiple
# overlapping phrasings per track (and a couple of cross-track combos) so a
# posting that only matches one wording still gets caught.
search_queries:
  # -- SWE --
  - name: SWE Intern — Summer 2027
    query: '"Software Engineer Intern" OR "Machine Learning Engineer Intern" "Summer 2027"'
    enabled: true
  - name: Platform/Infra Engineer Intern — Summer 2027
    query: '"Platform Engineer Intern" OR "ML Infrastructure Intern" OR "ML Platform Intern" "Summer 2027"'
    enabled: true
  # -- Data Scientist / Applied DS / Research Data Scientist --
  - name: Data Scientist / Applied DS / Research Data Scientist Intern — Summer 2027
    query: '"Data Scientist Intern" OR "Applied Data Scientist" OR "Research Data Scientist" "Summer 2027" visa sponsorship'
    enabled: true
  # -- Applied / Research Scientist / GenAI / LLM / Agentic --
  - name: Applied/Research Scientist — visa sponsorship
    query: '"Applied Scientist" OR "Research Scientist" intern 2027 "visa sponsorship"'
    enabled: true
  - name: GenAI/LLM/Agentic Intern — Summer 2027
    query: '"GenAI" OR "Generative AI" OR "LLM" OR "Agentic" intern "Summer 2027"'
    enabled: true
  - name: Applied AI / ML Scientist Intern — Summer 2027
    query: '"Applied AI" OR "Machine Learning Scientist" intern "Summer 2027"'
    enabled: true
  # -- Quant Research + Quant Trading --
  - name: Quant Research Intern — Summer 2027
    query: '"Quantitative Research Intern" OR "Quant Research Intern" "Summer 2027"'
    enabled: true
  - name: Quant Trading/Trader Intern — Summer 2027
    query: '"Quant Trader" OR "Quantitative Trading" OR "Quantitative Analyst" intern "Summer 2027"'
    enabled: true
  - name: Quant Developer Intern — Summer 2027
    query: '"Quantitative Developer" OR "Quant Developer Intern" "Summer 2027"'
    enabled: true
