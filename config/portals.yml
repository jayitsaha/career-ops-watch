# -- Search queries --
# Broad discovery fallback for postings outside tracked_companies.
search_queries:
  - name: SWE Intern — Summer 2027
    query: '"Software Engineer Intern" OR "Machine Learning Engineer Intern" "Summer 2027"'
    enabled: true
  - name: Quant Research Intern — Summer 2027
    query: '"Quantitative Research Intern" OR "Quant Research Intern" "Summer 2027"'
    enabled: true
  - name: Data Scientist / Applied DS / Research Data Scientist Intern — Summer 2027
    query: '"Data Scientist Intern" OR "Applied Data Scientist" OR "Research Data Scientist" "Summer 2027" visa sponsorship'
    enabled: true
