# Portal Scanner Configuration — Jayit Saha
# Copied/customized from templates/portals.example.yml.
# Targets (narrowed 2026-07-29 per explicit request): Data Science / Applied DS /
# Research Data Scientist, Software Engineering / SWE, and Quant Research
# internships for Summer 2027, US-based only. General Applied/Research
# Scientist, GenAI/LLM/Agentic, and quant-trading roles are intentionally
# EXCLUDED now — this list is deliberately narrower than career-ops's own
# config/profile.yml (the interactive CV-tailoring tool still targets the
# broader set of tracks; this file only controls what triggers a notification).
#
# NOTE on tracked_companies below: careers_url values are the correct BRANDED
# career pages per company. Provider auto-detection (Greenhouse/Lever/Ashby/
# Workday/etc.) works out of the box for some of these; several big-cap
# companies (Google, Meta, Apple, Netflix, Jane Street, etc.) run custom
# in-house career boards with no public ATS API, so scan.mjs will fall back
# to the WebSearch strategy (level 3) for those rather than the zero-token
# API path (level 2) — that's expected, not a misconfiguration. Run
# `node validate-portals.mjs` after editing to sanity-check this file.
#
# A hard "must mention 2027" text gate is additionally applied in
# scripts/run.mjs (after this filter runs) since most raw ATS postings have
# no structured year field — see requiresYearMention() there.

title_filter:
  positive:
    # -- Data Scientist / Applied DS / Research Data Scientist --
    - "Data Scientist Intern"
    - "Data Science Intern"
    - "Applied Data Scientist"
    - "Research Data Scientist"
    # -- Software Engineer / SWE (+ close variants) --
    - "Software Engineer Intern"
    - "SWE Intern"
    - "ML Engineer Intern"
    - "Machine Learning Engineer Intern"
    - "Platform Engineer Intern"
    - "ML Infrastructure Intern"
    - "ML Platform Intern"
    # -- Quant Research (+ close variants) --
    - "Quantitative Research Intern"
    - "Quant Research Intern"
    - "Quantitative Researcher"
    - "Quant Researcher"
    - "Quantitative Developer Intern"
    - "Quant Developer Intern"
  negative:
    - ".NET"
    - "PHP"
    - "Embedded"
    - "Firmware"
    - "FPGA"
    - "ASIC"
    - "Blockchain"
    - "Web3"
    - "Crypto Trading"
    - "Salesforce Admin"
    - "SAP "
    - "Mainframe"
    - "COBOL"
    - "Full-time"  # this account targets internships; drop obvious FTE-only postings when the title says so explicitly
    - "Quant Trader"  # trading, not research — out of scope per explicit request
    - "Quantitative Analyst"  # trading-desk analyst, not research — out of scope
  seniority_boost:
    - "Intern"
    - "Summer 2027"
    - "2027"
    - "PhD"
    - "MS"

# -- Location filter --
# US-based only: F-1/CPT requires a US work location (see modes/_profile.md).
location_filter:
  always_allow:
    - "United States"
    - "Atlanta"
  allow:
    - "Remote"
    - "United States"
    - "USA"
    - "US"
    - "Atlanta"
    - "New York"
    - "San Francisco"
    - "Seattle"
    - "Chicago"
    - "Austin"
    - "Boston"
  block:
    - "India"
    - "Bengaluru"
    - "United Kingdom"
    - "London"
    - "Germany"
    - "Singapore"
    - "China"
    - "Canada"  # visa path is US-specific (F-1/CPT); drop non-US postings

# -- Visa filter --
# Surface roles that mention sponsorship; don't hard-drop roles that are silent
# (per modes/_profile.md: silence on sponsorship should score neutral, not be
# treated as a blocker). Only an explicit "no sponsorship" should reject.
visa_filter:
  enabled: true
  require_mention: false

# -- Trust filter --
trust_filter:
  enabled: true

