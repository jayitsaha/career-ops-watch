name: career-ops watch

on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: career-ops-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run career-ops scan and notify
        env:
          NIM_API_KEY: ${{ secrets.NIM_API_KEY }}
          NIM_MODEL: ${{ vars.NIM_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/run.mjs

      - name: Commit updated state
        run: |
          git config user.name "career-ops-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/
          if ! git diff --cached --quiet; then
            git commit -m "chore: update career-ops-watch state [skip ci]"
            git push
          else
            echo "No state changes to commit."
          fi
